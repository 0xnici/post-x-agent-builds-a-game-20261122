<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>NEON BREAKOUT — built from one prompt</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05020e; overflow: hidden; }
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; width: 100%; height: 100%; object-fit: contain; touch-action: none; }
  #hint {
    position: fixed; left: 50%; bottom: 1.6vh; transform: translateX(-50%);
    color: #7e89aa; font-size: clamp(9px, 1.25vh, 15px); letter-spacing: .1em;
    white-space: nowrap; pointer-events: none; text-align: center;
  }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1080" height="1920"></canvas></div>
<div id="hint">MOVE TO PLAY &nbsp;·&nbsp; SPACE = AUTOPILOT &nbsp;·&nbsp; R = RESET &nbsp;·&nbsp; BUILT BY AN AI AGENT FROM ONE PROMPT</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  const W = 1080, H = 1920;

  const C = {
    cyan: '#22d3ee', pink: '#ff2d78', lime: '#3dff8e',
    amber: '#ffe14d', violet: '#a78bfa', white: '#eef4ff'
  };
  const COLS = 10, ROWS = 6, BW = 84, BH = 34, GAP = 10;
  const OX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, OY = 560;
  const PW = 220, PH = 26, PY = 1660, R = 15;
  const PALETTE = [C.pink, '#ff9f1c', C.amber, C.lime, C.cyan, C.violet];

  let bricks = [], parts = [], ball, pad;
  let score = 0, combo = 0, lives = 3, cleared = 0;
  let auto = true, t = 0;

  const rand = (a, b) => a + Math.random() * (b - a);

  function makeBricks() {
    bricks = [];
    for (let r = 0; r < ROWS; r++) {
      for (let k = 0; k < COLS; k++) {
        bricks.push({
          x: OX + k * (BW + GAP), y: OY + r * (BH + GAP),
          w: BW, h: BH, col: PALETTE[r], on: true
        });
      }
    }
  }

  function resetBall(dir) {
    ball = { x: W / 2, y: PY - 70, vx: dir * 540, vy: -880 };
    combo = 0;
  }

  function reset() {
    makeBricks();
    parts = [];
    pad = { x: W / 2, target: W / 2 };
    score = 0; lives = 3; cleared = 0;
    resetBall(1);
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(150, 520);
      parts.push({
        x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 120,
        life: rand(0.35, 0.85), col: col, size: rand(4, 10)
      });
    }
  }

  function glow(col, blur) { g.shadowColor = col; g.shadowBlur = blur; }

  function step(dt) {
    t += dt;
    const target = auto ? ball.x : pad.target;
    pad.x += Math.max(-1000 * dt, Math.min(1000 * dt, target - pad.x));
    pad.x = Math.max(PW / 2, Math.min(W - PW / 2, pad.x));

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    if (ball.x < R) { ball.x = R; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - R) { ball.x = W - R; ball.vx = -Math.abs(ball.vx); }
    if (ball.y < 250) { ball.y = 250; ball.vy = Math.abs(ball.vy); }

    if (ball.vy > 0 && ball.y + R >= PY && ball.y - R <= PY + PH &&
        Math.abs(ball.x - pad.x) < PW / 2 + R) {
      ball.y = PY - R;
      ball.vx = ((ball.x - pad.x) / (PW / 2)) * 820;
      ball.vy = -Math.abs(ball.vy);
      combo++; score += 10 * combo;
    }

    for (const b of bricks) {
      if (!b.on) continue;
      if (ball.x + R >= b.x && ball.x - R <= b.x + b.w &&
          ball.y + R >= b.y && ball.y - R <= b.y + b.h) {
        b.on = false; cleared++; combo++; score += 100 * combo;
        burst(b.x + b.w / 2, b.y + b.h / 2, b.col, 16);
        ball.vy = ball.y < b.y + b.h / 2 ? Math.abs(ball.vy) : -Math.abs(ball.vy);
        break;
      }
    }
    if (!bricks.some(b => b.on)) makeBricks();

    if (ball.y > H + 50) {
      lives--; combo = 0;
      if (lives <= 0) { score = 0; lives = 3; makeBricks(); }
      resetBall(cleared % 2 ? 1 : -1);
    }

    for (const p of parts) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 720 * dt; p.life -= dt;
    }
    parts = parts.filter(p => p.life > 0);
  }

  function draw() {
    g.fillStyle = '#05020e';
    g.fillRect(0, 0, W, H);

    g.strokeStyle = 'rgba(96,64,158,0.14)';
    g.lineWidth = 2;
    for (let x = 0; x < W; x += 120) {
      g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    }
    for (let y = 0; y < H; y += 120) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    }

    for (const b of bricks) {
      if (!b.on) continue;
      glow(b.col, 18);
      g.fillStyle = b.col;
      g.beginPath(); g.roundRect(b.x, b.y, b.w, b.h, 8); g.fill();
      g.shadowBlur = 0;
      g.fillStyle = 'rgba(255,255,255,.72)';
      g.fillRect(b.x + 8, b.y + 5, b.w - 16, 3);
    }

    for (const p of parts) {
      glow(p.col, 12);
      g.fillStyle = p.col;
      g.beginPath();
      g.arc(p.x, p.y, p.size * Math.max(0.2, p.life), 0, Math.PI * 2);
      g.fill();
    }
    g.shadowBlur = 0;

    glow(C.cyan, 28);
    g.strokeStyle = C.cyan; g.lineWidth = 10; g.lineCap = 'round';
    g.beginPath(); g.moveTo(pad.x - PW / 2, PY); g.lineTo(pad.x + PW / 2, PY); g.stroke();
    g.fillStyle = C.lime;
    g.beginPath(); g.arc(pad.x - PW / 2, PY, 10, 0, 7); g.fill();
    g.beginPath(); g.arc(pad.x + PW / 2, PY, 10, 0, 7); g.fill();

    glow(C.cyan, 34);
    g.fillStyle = C.white;
    g.beginPath(); g.arc(ball.x, ball.y, R, 0, 7); g.fill();
    g.shadowBlur = 0;

    g.textAlign = 'center';
    glow(C.violet, 16);
    g.fillStyle = C.white;
    g.font = '900 74px system-ui, sans-serif';
    g.fillText('NEON BREAKOUT', W / 2, 160);
    g.shadowBlur = 0;
    g.fillStyle = C.cyan;
    g.font = '600 30px ui-monospace, monospace';
    g.fillText('BUILT FROM ONE PROMPT', W / 2, 220);

    g.textAlign = 'left';
    g.fillStyle = C.amber;
    g.font = '700 34px ui-monospace, monospace';
    g.fillText('SCORE ' + String(score).padStart(6, '0'), 56, 300);
    g.textAlign = 'right';
    g.fillStyle = combo > 2 ? C.lime : C.white;
    g.fillText('x' + combo + '  ·  ' + lives + ' LIVES', W - 56, 300);

    g.textAlign = 'center';
    g.fillStyle = 'rgba(160,170,200,.85)';
    g.font = '500 26px ui-monospace, monospace';
    g.fillText('make.fun  ·  one prompt, one agent', W / 2, H - 40);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    step(dt);
    draw();
    requestAnimationFrame(loop);
  }

  function pointTo(e) {
    const r = cv.getBoundingClientRect();
    pad.target = (e.clientX - r.left) / r.width * W;
    auto = false;
  }
  cv.addEventListener('pointermove', pointTo);
  cv.addEventListener('pointerdown', pointTo);
  addEventListener('keydown', e => {
    if (e.code === 'Space') { auto = !auto; e.preventDefault(); }
    if (e.key === 'r' || e.key === 'R') reset();
  });

  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
