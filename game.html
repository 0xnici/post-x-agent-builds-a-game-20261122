<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEON BREAKOUT — built from one prompt</title>
<style>
  html,body{margin:0;padding:0;background:#070312;height:100%;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<canvas id="game" width="1080" height="1920"></canvas>
<script>
"use strict";
// NEON BREAKOUT — a tiny browser game, built from one prompt:
// "Build me a juicy neon Breakout game in one HTML file: glowing bricks,
//  a paddle with a light trail, particles on every break, combo score,
//  and an autoplay demo mode so I can watch it play itself."
const W = 1080, H = 1920;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

const COLS = 10, ROWS = 6, BW = 96, BH = 44, GAP = 8;
const OX = (W - (COLS * BW + (COLS - 1) * GAP)) / 2, OY = 240;
const PALETTE = ['#ff2d78','#ff9f1c','#ffe14d','#3dff8e','#22d3ee','#a78bfa'];
const PADDLE_W = 220, PADDLE_H = 26, PADDLE_Y = H - 650;
const BALL_R = 16;

let bricks, ball, paddle, particles, trail, score, combo, lives, state, t, level;

function buildBricks() {
  bricks = [];
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: OX + c * (BW + GAP), y: OY + r * (BH + GAP),
                    w: BW, h: BH, color: PALETTE[r % PALETTE.length], alive: true });
}
function resetBall() {
  ball = { x: W / 2, y: PADDLE_Y - 60, vx: 650, vy: -950 };
}
function reset() {
  buildBricks();
  resetBall();
  paddle = { x: W / 2 - PADDLE_W / 2, tx: W / 2 };
  particles = []; trail = [];
  score = 0; combo = 0; lives = 3; state = 'play'; t = 0; level = 1;
}
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 420;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                     life: 0.5 + Math.random() * 0.4, max: 0.9, color,
                     size: 3 + Math.random() * 7 });
  }
}
function step(dt) {
  t += dt;
  // autoplay paddle: chase the ball, capped speed
  const target = ball.vy > 0 ? ball.x : W / 2;
  const want = Math.max(PADDLE_W / 2, Math.min(W - PADDLE_W / 2, target));
  const dx = want - (paddle.x + PADDLE_W / 2);
  const mv = Math.max(-1800 * dt, Math.min(1800 * dt, dx));
  paddle.x += mv;
  trail.push({ x: paddle.x + PADDLE_W / 2, y: PADDLE_Y, life: 0.35 });
  if (trail.length > 26) trail.shift();

  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.x < BALL_R) { ball.x = BALL_R; ball.vx = Math.abs(ball.vx); }
  if (ball.x > W - BALL_R) { ball.x = W - BALL_R; ball.vx = -Math.abs(ball.vx); }
  if (ball.y < BALL_R + 120) { ball.y = BALL_R + 120; ball.vy = Math.abs(ball.vy); }
  if (ball.y > H) { // lost ball
    lives--; combo = 0;
    if (lives <= 0) { reset(); return; }
    resetBall(); return;
  }
  // paddle bounce
  if (ball.vy > 0 && ball.y + BALL_R >= PADDLE_Y && ball.y < PADDLE_Y + PADDLE_H &&
      ball.x > paddle.x - BALL_R && ball.x < paddle.x + PADDLE_W + BALL_R) {
    const rel = (ball.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2);
    const sp = Math.min(1500, Math.hypot(ball.vx, ball.vy) + 14);
    const ang = rel * 1.05;
    ball.vx = sp * Math.sin(ang); ball.vy = -sp * Math.cos(ang);
    ball.y = PADDLE_Y - BALL_R;
    burst(ball.x, PADDLE_Y, '#ffffff', 8);
  }
  // brick hits
  for (const b of bricks) {
    if (!b.alive) continue;
    if (ball.x + BALL_R > b.x && ball.x - BALL_R < b.x + b.w &&
        ball.y + BALL_R > b.y && ball.y - BALL_R < b.y + b.h) {
      b.alive = false;
      const overlapL = ball.x + BALL_R - b.x, overlapR = b.x + b.w - (ball.x - BALL_R);
      const overlapT = ball.y + BALL_R - b.y, overlapB = b.y + b.h - (ball.y - BALL_R);
      const m = Math.min(overlapL, overlapR, overlapT, overlapB);
      if (m === overlapT) ball.vy = -Math.abs(ball.vy);
      else if (m === overlapB) ball.vy = Math.abs(ball.vy);
      else if (m === overlapL) ball.vx = -Math.abs(ball.vx);
      else ball.vx = Math.abs(ball.vx);
      combo++; score += 10 * combo;
      burst(ball.x, ball.y, b.color, 14);
      break;
    }
  }
  if (bricks.every(b => !b.alive)) { level++; buildBricks(); resetBall(); }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const s of trail) s.life -= dt;
  trail = trail.filter(s => s.life > 0);
}
function draw() {
  ctx.fillStyle = '#070312'; ctx.fillRect(0, 0, W, H);
  // starfield
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 90; i++) {
    const sx = (i * 173) % W, sy = (i * 311) % H;
    ctx.fillRect(sx, sy, 2, 2);
  }
  // title + score
  ctx.textAlign = 'center';
  ctx.font = '900 64px system-ui, sans-serif';
  ctx.fillStyle = '#ff2d78';
  ctx.shadowColor = '#ff2d78'; ctx.shadowBlur = 34;
  ctx.fillText('NEON BREAKOUT', W / 2, 120);
  ctx.shadowBlur = 0;
  ctx.font = '700 52px system-ui, sans-serif';
  ctx.fillStyle = '#ffffff';
  ctx.fillText('SCORE  ' + score, W / 2, 190);
  ctx.font = '600 34px system-ui, sans-serif';
  ctx.fillStyle = '#ffe14d';
  if (combo > 1) ctx.fillText('COMBO x' + combo, W / 2, 232);
  // bricks
  for (const b of bricks) {
    if (!b.alive) continue;
    ctx.save();
    ctx.shadowColor = b.color; ctx.shadowBlur = 22;
    ctx.fillStyle = b.color;
    roundRect(b.x, b.y, b.w, b.h, 10); ctx.fill();
    ctx.restore();
  }
  // particles
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
  // paddle trail + paddle
  for (const s of trail) {
    ctx.globalAlpha = Math.max(0, s.life / 0.35) * 0.5;
    ctx.fillStyle = '#22d3ee';
    roundRect(s.x - PADDLE_W / 2, s.y, PADDLE_W, PADDLE_H, 13); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.save();
  ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 30;
  ctx.fillStyle = '#e8fbff';
  roundRect(paddle.x, PADDLE_Y, PADDLE_W, PADDLE_H, 13); ctx.fill();
  ctx.restore();
  // ball
  ctx.save();
  ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 36;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // footer + live stats strip
  ctx.font = '600 30px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('one prompt · built by an AI agent · make.fun', W / 2, PADDLE_Y + 110);
  const left = bricks.filter(b => b.alive).length;
  ctx.font = '700 40px system-ui, sans-serif';
  ctx.fillStyle = '#22d3ee';
  ctx.fillText('BRICKS LEFT  ' + left + '   ·   LEVEL ' + level + '   ·   BALLS ' + lives, W / 2, PADDLE_Y + 190);
  ctx.font = '900 72px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,45,120,0.16)';
  ctx.fillText('ONE PROMPT', W / 2, PADDLE_Y + 330);
  ctx.font = '700 40px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillText('built this game while you watch', W / 2, PADDLE_Y + 400);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
// deterministic seek: re-simulate from 0 to t (used for video frames)
window.seek = function (secs) {
  reset();
  const DT = 1 / 120;
  let done = 0;
  while (done < secs) { step(Math.min(DT, secs - done)); done += DT; }
  draw();
};
// live autoplay loop (interactive play: mouse / touch moves paddle too)
reset();
let last = performance.now();
function loop(now) {
  if (window.__paused) return;
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  step(dt); draw();
  requestAnimationFrame(loop);
}
cv.addEventListener('pointermove', e => {
  const r = cv.getBoundingClientRect();
  paddle.x = Math.max(0, Math.min(W - PADDLE_W, (e.clientX - r.left) / r.width * W - PADDLE_W / 2));
});
requestAnimationFrame(loop);
</script>
</body>
</html>
